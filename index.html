<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f7f3">
    <title>OMP로 알아보는 하네스 엔지니어링 — omp.study</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@800&display=swap">
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('omp-study.theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
      })();
    </script>
    <link rel="stylesheet" href="./assets/css/site.css">
    <link rel="stylesheet" href="./assets/css/ambient.css">
    <link rel="stylesheet" href="./assets/css/title.css">
    <link rel="stylesheet" href="./assets/css/topic.css">
    <link rel="stylesheet" href="./assets/css/syntax.css">
    <link rel="stylesheet" href="./assets/css/demo.css">
    <link rel="stylesheet" href="./assets/css/presentation.css">
    <link rel="stylesheet" href="./assets/css/print.css">
    <script type="module" src="./src/app.ts"></script>
  </head>
  <body>
    <div id="site"></div>
    <noscript>
      <main class="page-width script-notice">
        <h1>OMP로 알아보는 하네스 엔지니어링</h1>
        <p>목차와 대화형 예시를 보려면 JavaScript를 사용하도록 설정해 주세요.</p>
      </main>
    </noscript>
  </body>
</html>
